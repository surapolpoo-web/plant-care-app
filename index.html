<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlantCare AI Pro - Step by Step</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .step-inactive { opacity: 0.4; pointer-events: none; }
        .progress-bar { transition: width 1.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div class="max-w-2xl mx-auto p-4 md:p-6">
        
        <section id="inputSection" class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <div class="bg-green-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 rotate-3 shadow-lg">
                    <i class="fas fa-list-ol text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800">PlantCare AI Pro</h1>
                <p class="text-slate-500 text-sm">กรุณาทำตามขั้นตอน 1-2-3 ด้านล่าง</p>
            </div>

            <div class="space-y-6">
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                        เลือกกลุ่มและชนิดพืช
                    </label>
                    <div class="grid grid-cols-1 gap-3">
                        <select id="plantCategory" onchange="updatePlantList()" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-green-500">
                            <option value="">-- เลือกกลุ่มพืช --</option>
                            <option value="vegetable">ผักสวนครัว (คะน้า, ผักชี, กะเพรา, ฯลฯ)</option>
                            <option value="fruit">พืชสวน/ไม้ผล (ทุเรียน, มะม่วง, มะนาว)</option>
                            <option value="field">พืชไร่ (ข้าว, มันสำปะหลัง, อ้อย)</option>
                        </select>
                        <select id="plantType" onchange="enableUpload()" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-green-500">
                            <option value="">-- เลือกชนิดพืช --</option>
                        </select>
                    </div>
                </div>

                <div id="step2" class="step-inactive p-4 bg-slate-50 rounded-2xl border border-slate-100 transition-all">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                        ถ่ายภาพหรืออัปโหลดรูปใบพืช
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handlePreview(this)">
                    <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:bg-white transition-all overflow-hidden relative bg-white/50">
                        <img id="imagePreview" class="hidden w-full h-full object-cover">
                        <div id="placeholder" class="text-slate-400 text-center">
                            <i class="fas fa-camera text-3xl mb-2"></i>
                            <p class="text-sm font-bold">กดเพื่อถ่ายรูปใบพืช</p>
                        </div>
                    </label>
                </div>

                <div id="step3" class="step-inactive transition-all">
                    <button onclick="runAnalysis()" class="w-full bg-green-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all text-xl flex items-center justify-center gap-3">
                        <i class="fas fa-microscope"></i> 3. เริ่มวิเคราะห์ทันที
                    </button>
                </div>
            </div>
        </section>

        <section id="resultSection" class="hidden space-y-4">
            <div class="flex gap-2">
                <button onclick="resetApp()" class="flex-1 bg-white text-slate-600 font-bold py-3 rounded-xl border shadow-sm">เปลี่ยนพืช</button>
                <button onclick="downloadPDF()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">บันทึก PDF</button>
            </div>
            <div id="pdfContent" class="bg-white rounded-[2rem] shadow-sm border overflow-hidden">
                <div class="p-6 bg-slate-900 text-white flex justify-between items-center">
                    <div>
                        <h2 id="outPlantTitle" class="text-2xl font-bold italic">ชื่อพืช</h2>
                        <p id="outDate" class="text-green-400 text-xs mt-1"></p>
                    </div>
                </div>
                <div class="p-6 space-y-6">
                    <div class="flex justify-between items-end">
                        <h3 id="outDisease" class="text-xl font-bold text-slate-800 w-2/3 leading-tight">ชื่อโรค</h3>
                        <span id="outSeverityText" class="text-4xl font-black text-red-500">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden border">
                        <div id="outBar" class="progress-bar h-full bg-gradient-to-r from-orange-400 to-red-600" style="width: 0%"></div>
                    </div>
                    <div class="space-y-4">
                        <div class="p-4 bg-red-50 border-l-4 border-red-500 rounded-lg">
                            <p class="text-xs font-bold text-red-800 uppercase mb-1">แนวทางแก้ไข:</p>
                            <p id="outShort" class="text-red-900 text-sm font-medium"></p>
                        </div>
                        <div class="p-4 bg-blue-50 border-l-4 border-blue-500 rounded-lg">
                            <p class="text-xs font-bold text-blue-800 uppercase mb-1">วิธีป้องกัน:</p>
                            <p id="outLong" class="text-blue-900 text-sm font-medium"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const plantData = {
            vegetable: [
                { name: "คะน้า", disease: "โรคราน้ำค้าง (Downy Mildew)", short: "พ่นสารแมนโคเซ็บ หรือ เมทาแลกซิล ทันทีเมื่อพบรอยแผลสีเหลืองบนใบ", long: "ลดความชื้นในแปลง และปลูกคะน้าให้มีระยะห่างที่เหมาะสม" },
                { name: "ผักชี", disease: "โรคใบไหม้และเน่าคอดิน", short: "ถอนต้นที่เป็นโรคออก ลดปริมาณการให้น้ำเพื่อลดความชื้นที่โคนต้น", long: "ตากดินก่อนปลูกอย่างน้อย 1 สัปดาห์ และคลุกเมล็ดด้วยสารกันรา" },
                { name: "กะเพรา", disease: "โรคใบจุดสีน้ำตาล", short: "เด็ดใบที่เป็นจุดทิ้ง พ่นสารสกัดจากใบยาสูบหรือกำมะถันผงละลายน้ำ", long: "ทำความสะอาดแปลงไม่ให้มีเศษใบเน่าค้างอยู่ตามโคนต้น" },
                { name: "โหระพา", disease: "โรคราน้ำค้าง", short: "ตัดกิ่งที่มีสปอร์สีเทาใต้ใบไปเผาทำลาย พ่นน้ำปูนใสหรือคอปเปอร์", long: "เปลี่ยนดินหรือวัสดุปลูกใหม่หากเกิดโรคระบาดซ้ำซ้อน" },
                { name: "สะระแหน่", disease: "โรคราสนิม (Rust)", short: "ตัดแต่งกิ่งให้โปร่ง พ่นสารป้องกันเชื้อรากลุ่มกำมะถัน", long: "งดรดน้ำตอนเย็นเพื่อไม่ให้ใบชื้นค้างคืน" }
            ],
            field: [
                { name: "ข้าว", disease: "โรคไหม้ข้าว (Rice Blast)", short: "พ่นสารฟูจิ-วัน หรือ สารไตรไซคลาโซล ตามอัตราที่ระบุ", long: "เลือกใช้พันธุ์ข้าวต้านทานโรค และหลีกเลี่ยงการใช้ปุ๋ยยูเรียมากเกินไป" },
                { name: "มันสำปะหลัง", disease: "โรคใบด่าง", short: "ทำลายต้นทิ้งทันที ห้ามนำท่อนพันธุ์ไปใช้ต่อเด็ดขาด", long: "ใช้ท่อนพันธุ์สะอาดจากแหล่งที่เชื่อถือได้เท่านั้น" }
            ],
            fruit: [
                { name: "มะนาว", disease: "โรคแคงเกอร์", short: "ตัดแต่งกิ่งที่เป็นแผลตกสะเก็ด พ่นด้วยสารคอปเปอร์ออกซีคลอไรด์", long: "กำจัดหนอนชอนใบอย่างสม่ำเสมอเพื่อลดช่องทางการติดเชื้อ" }
            ]
        };

        function updatePlantList() {
            const cat = document.getElementById('plantCategory').value;
            const typeSelect = document.getElementById('plantType');
            typeSelect.innerHTML = '<option value="">-- เลือกชนิดพืช --</option>';
            if (cat && plantData[cat]) {
                plantData[cat].forEach((p, index) => {
                    typeSelect.innerHTML += `<option value="${index}">${p.name}</option>`;
                });
            }
            // Reset steps
            document.getElementById('step2').classList.add('step-inactive');
            document.getElementById('step3').classList.add('step-inactive');
        }

        function enableUpload() {
            if (document.getElementById('plantType').value !== "") {
                document.getElementById('step2').classList.remove('step-inactive');
            }
        }

        function handlePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                    document.getElementById('step3').classList.remove('step-inactive'); // เปิดปุ่มวิเคราะห์
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function runAnalysis() {
            const cat = document.getElementById('plantCategory').value;
            const typeIdx = document.getElementById('plantType').value;
            const selected = plantData[cat][typeIdx];

            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
            
            document.getElementById('outPlantTitle').innerText = selected.name;
            document.getElementById('outDisease').innerText = selected.disease;
            document.getElementById('outShort').innerText = selected.short;
            document.getElementById('outLong').innerText = selected.long;
            document.getElementById('outDate').innerText = "วันที่วิเคราะห์: " + new Date().toLocaleDateString('th-TH');
            
            const sev = Math.floor(Math.random() * 30) + 65;
            document.getElementById('outSeverityText').innerText = sev + "%";
            setTimeout(() => { document.getElementById('outBar').style.width = sev + "%"; }, 400);
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            html2pdf().from(element).set({
                margin: 0.5, filename: 'รายงานโรคพืช.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            }).save();
        }

        function resetApp() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('inputSection').classList.remove('hidden');
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
            document.getElementById('imageUpload').value = "";
            updatePlantList();
        }
    </script>
</body>
</html>
