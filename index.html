<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlantCare AI Pro - ระบบวินิจฉัยสมบูรณ์แบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .step-inactive { opacity: 0.4; pointer-events: none; }
        .progress-bar { transition: width 1.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div class="max-w-2xl mx-auto p-4 md:p-6">
        
        <section id="inputSection" class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <div class="bg-green-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                    <i class="fas fa-stethoscope text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800">PlantCare AI Pro</h1>
                <p class="text-slate-500 text-sm">ระบุพืชและสาเหตุการเกิดโรคแบบครบวงจร</p>
            </div>

            <div class="space-y-6">
                <div class="p-4 bg-slate-50 rounded-2xl border">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px]">1</span>
                        เลือกกลุ่มและชนิดพืช
                    </label>
                    <div class="grid grid-cols-1 gap-3">
                        <select id="plantCategory" onchange="updatePlantList()" class="w-full p-4 rounded-xl border-none shadow-sm outline-none focus:ring-2 focus:ring-green-500 text-lg">
                            <option value="">-- เลือกกลุ่มพืช --</option>
                            <option value="leafy">ผักกินใบ/เครื่องครัว (กะเพรา, คะน้า, หอม ฯลฯ)</option>
                            <option value="fruit_veg">ผักกินผล/เครือเถา (พริก, แตงกวา, มะเขือ ฯลฯ)</option>
                            <option value="herb">สมุนไพร/พืชหัว (ขิง, ข่า, ตะไคร้, ย่านาง ฯลฯ)</option>
                        </select>
                        <select id="plantType" onchange="enableUpload()" class="w-full p-4 rounded-xl border-none shadow-sm outline-none focus:ring-2 focus:ring-green-500 text-lg">
                            <option value="">-- เลือกชนิดพืช --</option>
                        </select>
                    </div>
                </div>

                <div id="step2" class="step-inactive p-4 bg-slate-50 rounded-2xl border transition-all">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px]">2</span>
                        ถ่ายภาพ/อัปโหลดรูป
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handlePreview(this)">
                    <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-44 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:bg-white transition-all overflow-hidden bg-white/50">
                        <img id="imagePreview" class="hidden w-full h-full object-cover">
                        <div id="placeholder" class="text-slate-400 text-center">
                            <i class="fas fa-camera text-4xl mb-2"></i>
                            <p class="text-sm font-bold">กดเพื่อถ่ายรูปใบพืช</p>
                        </div>
                    </label>
                </div>

                <div id="step3" class="step-inactive transition-all">
                    <button onclick="runAnalysis()" class="w-full bg-green-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all text-xl">
                        วิเคราะห์สาเหตุและวิธีแก้
                    </button>
                </div>
            </div>
        </section>

        <section id="resultSection" class="hidden space-y-4">
            <div class="flex gap-2">
                <button onclick="resetApp()" class="flex-1 bg-white text-slate-600 font-bold py-3 rounded-xl border shadow-sm">ตรวจใหม่</button>
                <button onclick="downloadPDF()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">บันทึก PDF</button>
            </div>

            <div id="pdfContent" class="bg-white rounded-[2rem] shadow-sm border overflow-hidden">
                <div class="p-6 bg-slate-900 text-white">
                    <h2 id="outPlantTitle" class="text-2xl font-bold">ชื่อพืช</h2>
                    <p id="outDate" class="text-green-400 text-xs mt-1"></p>
                </div>

                <div class="p-6 space-y-5">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">การวินิจฉัย</p>
                        <h3 id="outDisease" class="text-xl font-bold text-slate-800 leading-tight">ชื่อโรค</h3>
                    </div>

                    <div class="p-4 bg-amber-50 border-l-4 border-amber-500 rounded-r-xl shadow-sm">
                        <h4 class="text-sm font-bold text-amber-900 mb-1 flex items-center gap-2 underline">
                             สาเหตุการเกิดโรค:
                        </h4>
                        <p id="outCause" class="text-amber-800 text-sm leading-relaxed font-medium"></p>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        <div class="p-4 bg-red-50 border-l-4 border-red-500 rounded-r-xl">
                            <h4 class="text-[10px] font-bold text-red-900 mb-1 uppercase tracking-tighter">วิธีแก้เร่งด่วน:</h4>
                            <p id="outShort" class="text-red-800 text-sm"></p>
                        </div>
                        <div class="p-4 bg-green-50 border-l-4 border-green-500 rounded-r-xl">
                            <h4 class="text-[10px] font-bold text-green-900 mb-1 uppercase tracking-tighter">การป้องกัน:</h4>
                            <p id="outLong" class="text-green-800 text-sm"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const plantData = {
            leafy: [
                { name: "กะเพรา/โหระพา/แมงลัก", disease: "โรคใบจุดและใบไหม้", cause: "เชื้อรา Cercospora ระบาดหนักช่วงฝนตกชุก แสงแดดน้อย หรือรดน้ำโดนใบในเวลาเย็น ทำให้เกิดความชื้นสะสม", short: "เด็ดใบที่เป็นจุดออก พ่นน้ำปูนใสหรือเชื้อไตรโคเดอร์มา", long: "เว้นระยะปลูกให้โปร่ง และรดน้ำที่โคนต้นเท่านั้น" },
                { name: "คะน้า/ผักกาดหอม/ผักบุ้ง", disease: "โรคราน้ำค้าง / ราสนิมขาว", cause: "เชื้อรา Peronospora มักมากับลมและน้ำค้างในช่วงเช้า ชอบอากาศเย็นชื้น", short: "พ่นสารเมทาแลกซิล หรือน้ำหมักเหล้าขาวน้ำส้มสายชู", long: "ทำความสะอาดแปลงไม่ให้มีวัชพืชรก และตากดินก่อนปลูกเสมอ" },
                { name: "ต้นหอม/ผักชี/คื่นช่าย", disease: "โรคใบไหม้ / เน่าคอดิน", cause: "เชื้อราในดินทำลายโคนต้นเนื่องจากดินระบายน้ำไม่ดี หรือใช้ปุ๋ยไนโตรเจนมากเกินไปจนผนังเซลล์อ่อนแอ", short: "ถอนต้นที่เป็นโรคออก พ่นสารประกอบคอปเปอร์", long: "ปรับสภาพดินด้วยปูนขาว และไม่รดน้ำจนดินแฉะเกินไป" },
                { name: "ตำลึง/ผักหวานบ้าน/ชะอม", disease: "โรคยอดเน่าและราแป้ง", cause: "อากาศปิดและความชื้นในพุ่มใบสูงเกินไป ทำให้สปอร์เชื้อราเจริญเติบโตได้เร็ว", short: "ตัดแต่งยอดที่เป็นโรคทิ้ง พ่นน้ำผสมเบคกิ้งโซดาเจือจาง", long: "ตัดแต่งกิ่งให้ลมพัดผ่านสะดวกเสมอ" }
            ],
            fruit_veg: [
                { name: "พริก", disease: "โรคกุ้งแห้ง (Anthracnose)", cause: "เชื้อรา Colletotrichum แพร่กระจายได้ดีผ่านละอองฝน และสะสมอยู่ในเศษซากพืชเก่า", short: "พ่นสารอะซ็อกซีสโตรบิน หรือเก็บผลที่เป็นโรคไปเผาทำลาย", long: "เลือกเมล็ดพันธุ์จากแหล่งที่เชื่อถือได้ และไม่ปลูกพืชซ้ำในจุดเดิม" },
                { name: "มะเขือเปราะ/มะเขือยาว/มะเขือเทศ", disease: "โรคเหี่ยวเขียว / ใบไหม้", cause: "แบคทีเรียในดินอุดตันท่อน้ำเลี้ยง มักระบาดเมื่อดินมีสภาพเป็นกรดและน้ำขัง", short: "ถอนต้นเหี่ยวทิ้งทันที โรยปูนขาวในหลุมที่ขุดออก", long: "ปลูกพืชหมุนเวียนกลุ่มอื่นที่ไม่ใช่มะเขือหรือพริกเพื่อตัดวงจรโรค" },
                { name: "แตงกวา/บวบ/ฟักทอง/ถั่วฝักยาว", disease: "โรคราแป้ง / ราน้ำค้าง", cause: "สปอร์เชื้อราปลิวมาตามลม ระบาดได้ดีในอากาศแห้งช่วงกลางวันและชื้นช่วงกลางคืน", short: "พ่นด้วยกำมะถันผงละลายน้ำ หรือน้ำมันสะเดา", long: "รดน้ำสม่ำเสมอแต่อย่าให้ชื้นแฉะ และหมั่นกำจัดแมลงพาหะ" }
            ],
            herb: [
                { name: "ขิง/ข่า/ตะไคร้/ขมิ้น", disease: "โรคเหง้าเน่า / รากเน่า", cause: "เชื้อราและแบคทีเรียในดินเข้าทำลายแผลบริเวณเหง้าเมื่อดินมีน้ำขังระบายอากาศยาก", short: "ขุดกอที่เน่าออกทิ้งและโรยปูนขาว พ่นเมทาแลกซิลที่ดิน", long: "ยกร่องปลูกให้สูงหรือปลูกในวัสดุระบายน้ำดี" },
                { name: "ใบย่านาง/สะระแหน่/ผักแพว/ชะพลู", disease: "โรคใบจุดสีน้ำตาล", cause: "เกิดจากความชื้นในดินสูงและการขาดธาตุอาหารรองบางชนิด ทำให้พืชต้านทานโรคต่ำ", short: "เด็ดใบเสียออก พ่นด้วยน้ำส้มควันไม้เจือจาง", long: "บำรุงด้วยปุ๋ยอินทรีย์และปรับระยะห่างระหว่างต้น" },
                { name: "ใบมะกรูด", disease: "โรคแคงเกอร์", cause: "เชื้อแบคทีเรียเข้าทางแผลจากการทำลายของหนอนชอนใบ", short: "ตัดแต่งใบที่เป็นจุดนูนตกสะเก็ดออก พ่นด้วยคอปเปอร์", long: "กำจัดหนอนชอนใบอย่างสม่ำเสมอซึ่งเป็นพาหะหลัก" }
            ]
        };

        function updatePlantList() {
            const cat = document.getElementById('plantCategory').value;
            const typeSelect = document.getElementById('plantType');
            typeSelect.innerHTML = '<option value="">-- เลือกชนิดพืช --</option>';
            if (cat && plantData[cat]) {
                plantData[cat].forEach((p, index) => {
                    typeSelect.innerHTML += `<option value="${index}">${p.name}</option>`;
                });
            }
            document.getElementById('step2').classList.add('step-inactive');
            document.getElementById('step3').classList.add('step-inactive');
        }

        function enableUpload() {
            if (document.getElementById('plantType').value !== "") {
                document.getElementById('step2').classList.remove('step-inactive');
            }
        }

        function handlePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                    document.getElementById('step3').classList.remove('step-inactive');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function runAnalysis() {
            const cat = document.getElementById('plantCategory').value;
            const typeIdx = document.getElementById('plantType').value;
            const selected = plantData[cat][typeIdx];

            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
            
            document.getElementById('outPlantTitle').innerText = selected.name;
            document.getElementById('outDisease').innerText = selected.disease;
            document.getElementById('outCause').innerText = selected.cause;
            document.getElementById('outShort').innerText = selected.short;
            document.getElementById('outLong').innerText = selected.long;
            document.getElementById('outDate').innerText = "วันที่วินิจฉัย: " + new Date().toLocaleDateString('th-TH');
            window.scrollTo(0,0);
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            html2pdf().from(element).set({
                margin: 0.5, filename: 'PlantReport.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            }).save();
        }

        function resetApp() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('inputSection').classList.remove('hidden');
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
            document.getElementById('imageUpload').value = "";
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
