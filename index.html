<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlantCare AI Pro - Full Diagnosis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .step-inactive { opacity: 0.4; pointer-events: none; }
        .progress-bar { transition: width 1.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div class="max-w-2xl mx-auto p-4 md:p-6">
        
        <section id="inputSection" class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-200">
            <div class="text-center mb-6">
                <div class="bg-green-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 rotate-3 shadow-lg">
                    <i class="fas fa-microscope text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800">PlantCare AI Pro</h1>
                <p class="text-slate-500 text-sm">ระบบวินิจฉัยโรคพืชและสาเหตุ</p>
            </div>

            <div class="space-y-6">
                <div class="p-4 bg-slate-50 rounded-2xl border">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                        เลือกกลุ่มและชนิดพืช
                    </label>
                    <div class="grid grid-cols-1 gap-3">
                        <select id="plantCategory" onchange="updatePlantList()" class="w-full p-4 rounded-xl border-none shadow-sm outline-none focus:ring-2 focus:ring-green-500 text-lg">
                            <option value="">-- เลือกกลุ่มพืช --</option>
                            <option value="vegetable">ผักสวนครัว (คะน้า, พริก, กะเพรา, ฯลฯ)</option>
                            <option value="fruit">พืชสวน/ไม้ผล (ทุเรียน, มะม่วง, มะนาว)</option>
                            <option value="field">พืชไร่ (ข้าว, มันสำปะหลัง, อ้อย)</option>
                        </select>
                        <select id="plantType" onchange="enableUpload()" class="w-full p-4 rounded-xl border-none shadow-sm outline-none focus:ring-2 focus:ring-green-500 text-lg">
                            <option value="">-- เลือกชนิดพืช --</option>
                        </select>
                    </div>
                </div>

                <div id="step2" class="step-inactive p-4 bg-slate-50 rounded-2xl border transition-all">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                        ถ่ายภาพใบพืช
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handlePreview(this)">
                    <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-44 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:bg-white transition-all overflow-hidden bg-white/50">
                        <img id="imagePreview" class="hidden w-full h-full object-cover">
                        <div id="placeholder" class="text-slate-400 text-center">
                            <i class="fas fa-camera text-4xl mb-2"></i>
                            <p class="text-sm font-bold">กดเพื่อถ่ายรูปหรือเลือกรูป</p>
                        </div>
                    </label>
                </div>

                <div id="step3" class="step-inactive transition-all">
                    <button onclick="runAnalysis()" class="w-full bg-green-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all text-xl flex items-center justify-center gap-3">
                        เริ่มการวินิจฉัยสาเหตุ
                    </button>
                </div>
            </div>
        </section>

        <section id="resultSection" class="hidden space-y-4">
            <div class="flex gap-2">
                <button onclick="resetApp()" class="flex-1 bg-white text-slate-600 font-bold py-3 rounded-xl border shadow-sm">ตรวจใหม่</button>
                <button onclick="downloadPDF()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">บันทึกรายงาน PDF</button>
            </div>

            <div id="pdfContent" class="bg-white rounded-[2rem] shadow-sm border overflow-hidden">
                <div class="p-6 bg-slate-900 text-white flex justify-between items-center">
                    <div>
                        <h2 id="outPlantTitle" class="text-2xl font-bold">ชื่อพืช</h2>
                        <p id="outDate" class="text-green-400 text-xs mt-1"></p>
                    </div>
                    <div class="bg-white/10 p-2 rounded-lg text-center">
                        <p class="text-[10px] uppercase">ความรุนแรง</p>
                        <p id="outSeverityText" class="text-xl font-bold text-red-400">0%</p>
                    </div>
                </div>

                <div class="p-6 space-y-5">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">ผลการวินิจฉัย</p>
                        <h3 id="outDisease" class="text-xl font-bold text-slate-800 leading-tight italic">ชื่อโรค</h3>
                    </div>

                    <div class="p-4 bg-amber-50 border-l-4 border-amber-500 rounded-r-xl">
                        <h4 class="text-sm font-bold text-amber-900 mb-1 flex items-center gap-2">
                            <i class="fas fa-question-circle"></i> สาเหตุการเกิดโรค:
                        </h4>
                        <p id="outCause" class="text-amber-800 text-sm leading-relaxed"></p>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        <div class="p-4 bg-red-50 border-l-4 border-red-500 rounded-r-xl">
                            <h4 class="text-sm font-bold text-red-900 mb-1 italic">การแก้ไขเร่งด่วน:</h4>
                            <p id="outShort" class="text-red-800 text-sm"></p>
                        </div>
                        <div class="p-4 bg-green-50 border-l-4 border-green-500 rounded-r-xl">
                            <h4 class="text-sm font-bold text-green-900 mb-1 italic">การป้องกันระยะยาว:</h4>
                            <p id="outLong" class="text-green-800 text-sm"></p>
                        </div>
                    </div>

                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div id="outBar" class="progress-bar h-full bg-red-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const plantData = {
            vegetable: [
                { 
                    name: "คะน้า", 
                    disease: "โรคราน้ำค้าง (Downy Mildew)", 
                    cause: "เกิดจากเชื้อรา Peronospora parasitica มักระบาดในช่วงที่มีความชื้นสูง หรือมีน้ำค้างมากในช่วงเช้า",
                    short: "พ่นสารแมนโคเซ็บ หรือ เมทาแลกซิล ทันทีเมื่อพบรอยแผลสีเหลืองบนใบ", 
                    long: "ไม่ปลูกคะน้าแน่นเกินไป และใช้เมล็ดพันธุ์ที่ผ่านการฆ่าเชื้อ" 
                },
                { 
                    name: "ผักชี", 
                    disease: "โรคเน่าคอดิน (Damping Off)", 
                    cause: "เกิดจากเชื้อราในดิน (Pythium spp.) เข้าทำลายโคนต้นเนื่องจากดินแฉะเกินไปและระบายอากาศไม่ดี",
                    short: "ถอนต้นที่เน่าทิ้ง ลดการให้น้ำ และพ่นสารป้องกันกำจัดเชื้อรา", 
                    long: "ควรตากดินและผสมปูนขาวก่อนปลูกเพื่อฆ่าเชื้อในดิน" 
                },
                { 
                    name: "กะเพรา / โหระพา", 
                    disease: "โรคใบจุด (Leaf Spot)", 
                    cause: "เกิดจากเชื้อรา Cercospora spp. ระบาดหนักในช่วงหน้าฝนที่มีการกระเด็นของน้ำจากดินสู่ใบ",
                    short: "เด็ดใบที่เป็นจุดทิ้ง พ่นน้ำส้มควันไม้หรือสารคอปเปอร์", 
                    long: "ควรรดน้ำที่โคนต้นแทนการรดแบบพ่นฝอยใส่ใบ" 
                },
                { 
                    name: "สะระแหน่", 
                    disease: "โรคใบไหม้จากราสนิม", 
                    cause: "เกิดจากเชื้อรา Puccinia spp. สปอร์แพร่กระจายไปตามลมและน้ำ",
                    short: "ตัดแต่งกิ่งให้โปร่งเพื่อให้อากาศถ่ายเท พ่นด้วยสารกำมะถันผง", 
                    long: "หลีกเลี่ยงการให้น้ำจนเปียกชุ่มในช่วงเย็น" 
                }
            ],
            field: [
                { 
                    name: "ข้าว", 
                    disease: "โรคไหม้ข้าว (Rice Blast)", 
                    cause: "เกิดจากเชื้อรา Pyricularia oryzae มักระบาดเมื่อมีการใช้ปุ๋ยไนโตรเจนสูงเกินไปและอากาศมีความชื้นสูง",
                    short: "พ่นสารไตรไซคลาโซล หรือ สารคาสูกาไมซิน", 
                    long: "ปลูกพืชหมุนเวียน และลดอัตราการใช้ปุ๋ยยูเรียลง" 
                },
                { 
                    name: "มันสำปะหลัง", 
                    disease: "โรคใบด่าง (CMD)", 
                    cause: "เกิดจากเชื้อไวรัส โดยมีแมลงหวี่ขาวขาเทาสูบกินน้ำเลี้ยงเป็นพาหะนำโรค",
                    short: "ถอนทำลายต้นที่แสดงอาการทิ้งทันที ห้ามเก็บท่อนพันธุ์ไปใช้", 
                    long: "ใช้พันธุ์ทนทาน (เช่น KU50) และหมั่นกำจัดแมลงหวี่ขาว" 
                }
            ],
            fruit: [
                { 
                    name: "มะนาว", 
                    disease: "โรคแคงเกอร์ (Canker)", 
                    cause: "เกิดจากเชื้อแบคทีเรีย Xanthomonas citri เข้าทางบาดแผลที่เกิดจากหนอนชอนใบ",
                    short: "ตัดกิ่งที่เป็นโรคไปเผาทิ้ง พ่นด้วยสารคอปเปอร์ออกซีคลอไรด์", 
                    long: "ควบคุมหนอนชอนใบที่เป็นพาหะหลักอย่างเข้มงวด" 
                }
            ]
        };

        function updatePlantList() {
            const cat = document.getElementById('plantCategory').value;
            const typeSelect = document.getElementById('plantType');
            typeSelect.innerHTML = '<option value="">-- เลือกชนิดพืช --</option>';
            if (cat && plantData[cat]) {
                plantData[cat].forEach((p, index) => {
                    typeSelect.innerHTML += `<option value="${index}">${p.name}</option>`;
                });
            }
            document.getElementById('step2').classList.add('step-inactive');
            document.getElementById('step3').classList.add('step-inactive');
        }

        function enableUpload() {
            if (document.getElementById('plantType').value !== "") {
                document.getElementById('step2').classList.remove('step-inactive');
            }
        }

        function handlePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                    document.getElementById('step3').classList.remove('step-inactive');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function runAnalysis() {
            const cat = document.getElementById('plantCategory').value;
            const typeIdx = document.getElementById('plantType').value;
            const selected = plantData[cat][typeIdx];

            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
            
            document.getElementById('outPlantTitle').innerText = selected.name;
            document.getElementById('outDisease').innerText = selected.disease;
            document.getElementById('outCause').innerText = selected.cause; // แสดงสาเหตุ
            document.getElementById('outShort').innerText = selected.short;
            document.getElementById('outLong').innerText = selected.long;
            document.getElementById('outDate').innerText = "วันที่ตรวจ: " + new Date().toLocaleDateString('th-TH');
            
            const sev = Math.floor(Math.random() * 25) + 60;
            document.getElementById('outSeverityText').innerText = sev + "%";
            setTimeout(() => { document.getElementById('outBar').style.width = sev + "%"; }, 400);
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            html2pdf().from(element).set({
                margin: 0.5, filename: 'Report_Diagnosis.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            }).save();
        }

        function resetApp() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('inputSection').classList.remove('hidden');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
