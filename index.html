<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlantCare AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        
        :root {
            --primary-green: #16a34a;
        }

        body { 
            font-family: 'Sarabun', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        /* ปรับแต่งความลื่นไหลของ Progress Bar */
        .progress-bar { 
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* ตกแต่งส่วนที่จะพิมพ์เป็น PDF */
        #pdfContent {
            background: white;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* ป้องกันปุ่มเบี้ยวบน iPad */
        button {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-2xl mx-auto p-4 md:p-8">
        
        <section id="inputSection" class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100">
            <div class="text-center mb-10">
                <div class="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i class="fas fa-leaf text-green-600 text-4xl"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">PlantCare AI</h1>
                <p class="text-slate-500 mt-2">วิเคราะห์สุขภาพพืชด้วยระบบอัจฉริยะ</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">ชื่อพืช หรือ หมายเลขแปลง</label>
                    <input type="text" id="plantName" placeholder="เช่น มะนาวแป้น A1" 
                           class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-green-500 focus:bg-white outline-none transition-all text-lg">
                </div>
                
                <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handlePreview(this)">
                <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-64 border-3 border-dashed border-slate-300 rounded-[2rem] cursor-pointer hover:bg-green-50 hover:border-green-400 transition-all group overflow-hidden relative">
                    <img id="imagePreview" class="hidden w-full h-full object-cover">
                    <div id="placeholder" class="text-slate-400 text-center group-hover:text-green-600 transition-colors">
                        <i class="fas fa-camera text-5xl mb-4"></i>
                        <p class="font-bold text-xl">ถ่ายภาพ/อัปโหลดรูปใบพืช</p>
                        <p class="text-sm mt-1 opacity-70">รองรับภาพถ่ายจาก iPad/iPhone</p>
                    </div>
                </label>

                <button onclick="runAnalysis()" id="btnAnalyze" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-5 rounded-2xl shadow-lg shadow-green-200 transform active:scale-[0.98] transition-all text-xl flex items-center justify-center gap-3">
                    <i class="fas fa-microscope"></i> เริ่มการวิเคราะห์
                </button>
            </div>
        </section>

        <section id="resultSection" class="hidden space-y-6">
            <div class="flex gap-3">
                <button onclick="resetApp()" class="flex-1 bg-white text-slate-600 font-bold py-4 rounded-2xl shadow-sm border border-slate-200 active:bg-slate-100 flex items-center justify-center gap-2">
                    <i class="fas fa-redo"></i> วิเคราะห์ใหม่
                </button>
                <button onclick="downloadPDF()" class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg active:bg-blue-700 flex items-center justify-center gap-2">
                    <i class="fas fa-file-export"></i> ส่งออก PDF
                </button>
            </div>

            <div id="pdfContent" class="rounded-[2rem] shadow-2xl border border-slate-200 overflow-hidden">
                <div class="p-8 bg-slate-900 text-white flex justify-between items-center">
                    <div>
                        <h2 id="outPlantName" class="text-3xl font-bold italic">ชื่อพืช</h2>
                        <p class="text-green-400 font-medium mt-1">รายงานสถานะโดย PlantCare AI</p>
                    </div>
                    <div class="text-right text-xs opacity-60">
                        วันที่วิเคราะห์: <br>
                        <span id="currentDate" class="text-sm font-bold text-white"></span>
                    </div>
                </div>

                <div class="p-8 space-y-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                        <div>
                            <p class="text-slate-400 text-xs uppercase font-black tracking-widest mb-1">Health Status</p>
                            <h3 id="outDiseaseName" class="text-2xl font-bold text-slate-800">กำลังประมวลผล...</h3>
                            <div id="outBadge" class="inline-block mt-2 px-4 py-1 rounded-full text-xs font-black uppercase text-white bg-red-500">
                                วิกฤต
                            </div>
                        </div>
                        <div class="text-center md:text-right">
                            <span id="outSeverityText" class="text-6xl font-black text-red-500">0%</span>
                            <p class="text-slate-400 text-xs font-bold uppercase">Severity Level</p>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="w-full bg-slate-100 h-8 rounded-full overflow-hidden p-1.5 border-2 border-slate-50 shadow-inner">
                            <div id="outSeverityBar" class="progress-bar h-full rounded-full bg-gradient-to-r from-orange-400 to-red-600 shadow-md" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <div class="p-6 bg-orange-50 border-l-8 border-orange-500 rounded-2xl">
                            <h4 class="font-bold text-orange-900 text-lg mb-2 flex items-center gap-2">
                                <i class="fas fa-exclamation-triangle"></i> วิธีแก้ไขเร่งด่วน
                            </h4>
                            <p id="treatShort" class="text-orange-800 leading-relaxed font-medium text-base">รอผลวิเคราะห์...</p>
                        </div>
                        <div class="p-6 bg-green-50 border-l-8 border-green-500 rounded-2xl">
                            <h4 class="font-bold text-green-900 text-lg mb-2 flex items-center gap-2">
                                <i class="fas fa-shield-alt"></i> การป้องกันระยะยาว
                            </h4>
                            <p id="treatLong" class="text-green-800 leading-relaxed font-medium text-base">รอผลวิเคราะห์...</p>
                        </div>
                    </div>
                </div>
                
                <div class="p-4 bg-slate-50 text-center text-[10px] text-slate-400 border-t uppercase tracking-tighter">
                    Generated by PlantCare AI Mobile System &copy; 2024
                </div>
            </div>
        </section>
    </div>

    <script>
        // ระบบพรีวิวรูปภาพ
        function handlePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('imagePreview');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // ระบบวิเคราะห์ (Simulated AI)
        function runAnalysis() {
            const nameInput = document.getElementById('plantName').value.trim();
            const plantName = nameInput || "พืชทั่วไป (ไม่ระบุชื่อ)";
            const btn = document.getElementById('btnAnalyze');

            // แสดงสถานะโหลดบน iPad
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังประมวลผลข้อมูล...';
            btn.disabled = true;
            
            setTimeout(() => {
                document.getElementById('inputSection').classList.add('hidden');
                document.getElementById('resultSection').classList.remove('hidden');
                
                // ตั้งค่าวันที่ปัจจุบัน
                const options = { day: 'numeric', month: 'long', year: 'numeric' };
                document.getElementById('currentDate').innerText = new Date().toLocaleDateString('th-TH', options);
                
                updateResults(plantName);
                
                btn.innerHTML = '<i class="fas fa-microscope"></i> เริ่มการวิเคราะห์';
                btn.disabled = false;
            }, 1500);
        }

        function updateResults(name) {
            document.getElementById('outPlantName').innerText = name;
            
            // ข้อมูลจำลองการวิเคราะห์
            const severity = 82; 
            document.getElementById('outDiseaseName').innerText = "โรคใบจุดสีน้ำตาล (Leaf Spot)";
            document.getElementById('outSeverityText').innerText = severity + '%';
            document.getElementById('outSeverityBar').style.width = severity + '%';
            
            document.getElementById('treatShort').innerText = "ให้รีบตัดใบที่เป็นโรคออกและทำลายทิ้งทันที ห้ามนำไปทำปุ๋ยหมัก หากพบระบาดเกิน 30% ของต้น ให้พ่นสารคาร์เบนดาซิมตามอัตราส่วน";
            document.getElementById('treatLong').innerText = "ปรับระยะห่างระหว่างต้นให้โปร่งขึ้นเพื่อให้อากาศถ่ายเท และงดการให้น้ำแบบพ่นฝอยในช่วงเย็นเพื่อลดความชื้นสะสมบนใบ";
            
            // เลื่อนหน้าจอขึ้นไปบนสุด
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ระบบ PDF ที่รองรับ iPad (ใช้วิธีเปิด Blob URL)
        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const plantName = document.getElementById('outPlantName').innerText;
            
            const opt = {
                margin: [0.3, 0.3, 0.3, 0.3],
                filename: `Report-${plantName}.pdf`,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { 
                    scale: 3, // ความละเอียดสูง
                    useCORS: true,
                    letterRendering: true
                },
                jsPDF: { 
                    unit: 'in', 
                    format: 'a4', 
                    orientation: 'portrait' 
                }
            };

            // แสดง Loading ระหว่างสร้าง PDF
            const originalText = event.target.innerHTML;
            event.target.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังสร้างไฟล์...';

            html2pdf().set(opt).from(element).toPdf().get('pdf').then(function (pdf) {
                // วิธีการส่งออกไฟล์ที่ Safari บน iPad ชอบที่สุด
                const blobUrl = pdf.output('bloburl');
                window.open(blobUrl, '_blank');
                document.querySelector('button[onclick="downloadPDF()"]').innerHTML = '<i class="fas fa-file-export"></i> ส่งออก PDF';
            });
        }

        function resetApp() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('inputSection').classList.remove('hidden');
            
            // ล้างค่าข้อมูล
            document.getElementById('plantName').value = "";
            document.getElementById('imageUpload').value = "";
            document.getElementById('imagePreview').src = "";
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
            document.getElementById('outSeverityBar').style.width = '0%';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
