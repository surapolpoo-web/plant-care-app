<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlantCare AI Pro - ระบบวิเคราะห์อัจฉริยะ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .step-inactive { opacity: 0.4; pointer-events: none; }
        .analyzing-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body>

    <div class="max-w-2xl mx-auto p-4">
        
        <section id="inputSection" class="bg-white p-6 rounded-[2.5rem] shadow-2xl border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-green-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg rotate-3">
                    <i class="fas fa-robot text-white text-4xl"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-800">PlantCare AI</h1>
                <p class="text-slate-500">วิเคราะห์โรคพืชด้วยระบบ AI อัจฉริยะ</p>
            </div>

            <div class="space-y-6">
                <div class="p-5 bg-slate-50 rounded-2xl border-2 border-transparent focus-within:border-green-500 transition-all">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px]">1</span>
                        เลือกชนิดพืชที่ต้องการตรวจ
                    </label>
                    <select id="plantType" onchange="enableUpload()" class="w-full bg-white p-4 rounded-xl shadow-sm outline-none text-lg border border-slate-200">
                        <option value="">-- กรุณาเลือกพืช --</option>
                        <optgroup label="ผักกินใบ">
                            <option value="กะเพรา/โหระพา">กะเพรา/โหระพา</option>
                            <option value="คะน้า/กวางตุ้ง">คะน้า/กวางตุ้ง</option>
                            <option value="ผักชี/ต้นหอม">ผักชี/ต้นหอม</option>
                        </optgroup>
                        <optgroup label="สมุนไพร/พืชหัว">
                            <option value="ขิง/ข่า/ตะไคร้">ขิง/ข่า/ตะไคร้</option>
                            <option value="ใบมะกรูด">ใบมะกรูด</option>
                            <option value="ใบย่านาง">ใบย่านาง</option>
                        </optgroup>
                        <optgroup label="อื่นๆ">
                            <option value="พริก/มะเขือ">พริก/มะเขือ</option>
                            <option value="ทั่วไป">พืชชนิดอื่นๆ</option>
                        </optgroup>
                    </select>
                </div>

                <div id="step2" class="step-inactive p-5 bg-slate-50 rounded-2xl border-2 border-transparent transition-all">
                    <label class="block text-sm font-bold text-green-700 mb-3 flex items-center gap-2">
                        <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px]">2</span>
                        ถ่ายรูปใบพืชที่ชัดเจน
                    </label>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handlePreview(this)">
                    <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-52 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer hover:bg-white transition-all overflow-hidden bg-white">
                        <img id="imagePreview" class="hidden w-full h-full object-cover">
                        <div id="placeholder" class="text-slate-400 text-center p-4">
                            <i class="fas fa-camera-retro text-5xl mb-3 text-green-200"></i>
                            <p class="font-bold">แตะเพื่อถ่ายรูปหรือเลือกไฟล์</p>
                            <p class="text-xs mt-1">เห็นรอยโรคชัดๆ เพื่อความแม่นยำ</p>
                        </div>
                    </label>
                </div>

                <div id="step3" class="step-inactive pt-4">
                    <button onclick="startAnalysis()" id="btnAnalyze" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-5 rounded-2xl shadow-xl transform active:scale-95 transition-all text-xl flex items-center justify-center gap-3">
                        <i class="fas fa-microscope"></i> เริ่มวิเคราะห์ด้วย AI
                    </button>
                </div>
            </div>
        </section>

        <section id="resultSection" class="hidden space-y-6">
            <div id="loadingUI" class="bg-white p-10 rounded-[2.5rem] text-center shadow-xl border">
                <div class="analyzing-pulse mb-4">
                    <i class="fas fa-brain text-green-500 text-6xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-700">กำลังประมวลผลภาพ...</h2>
                <p class="text-slate-400 text-sm">AI กำลังตรวจสอบระดับความรุนแรงและสาเหตุ</p>
            </div>

            <div id="analysisContent" class="hidden space-y-4">
                <div class="flex gap-2">
                    <button onclick="resetApp()" class="flex-1 bg-white text-slate-600 font-bold py-4 rounded-2xl border shadow-sm transition-all active:bg-slate-50">ตรวจใหม่</button>
                    <button onclick="downloadPDF()" class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:bg-blue-700">บันทึกรายงาน PDF</button>
                </div>

                <div id="pdfContent" class="bg-white rounded-[2.5rem] shadow-2xl border overflow-hidden">
                    <div class="p-8 bg-gradient-to-br from-slate-900 to-slate-800 text-white relative">
                        <div class="absolute top-0 right-0 p-6 opacity-10">
                            <i class="fas fa-leaf text-8xl"></i>
                        </div>
                        <h2 id="resPlantName" class="text-3xl font-black mb-1 italic">ชื่อพืช</h2>
                        <div class="flex items-center gap-2 text-green-400">
                            <i class="fas fa-check-circle text-xs"></i>
                            <span id="resDate" class="text-xs font-bold uppercase tracking-widest"></span>
                        </div>
                    </div>

                    <div class="p-8 space-y-8">
                        <div class="relative">
                            <div class="flex justify-between items-end mb-2">
                                <h4 class="font-black text-slate-800 uppercase text-sm tracking-tighter">1. ระดับความรุนแรง (Severity)</h4>
                                <span id="resLevelText" class="text-3xl font-black text-red-600 leading-none">0%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-4 rounded-full border p-0.5">
                                <div id="resLevelBar" class="h-full rounded-full bg-gradient-to-r from-yellow-400 to-red-600 transition-all duration-1000" style="width: 0%"></div>
                            </div>
                        </div>

                        <div class="bg-amber-50 rounded-3xl p-6 border-l-8 border-amber-500 shadow-sm">
                            <h4 class="font-bold text-amber-900 mb-2 flex items-center gap-2">
                                <i class="fas fa-bug"></i> 2. สาเหตุการเกิดโรค
                            </h4>
                            <p id="resCause" class="text-amber-800 leading-relaxed"></p>
                        </div>

                        <div class="bg-red-50 rounded-3xl p-6 border-l-8 border-red-500 shadow-sm">
                            <h4 class="font-bold text-red-900 mb-2 flex items-center gap-2">
                                <i class="fas fa-tools"></i> 3. การแก้ไขปัญหา
                            </h4>
                            <p id="resFix" class="text-red-800 leading-relaxed font-medium"></p>
                        </div>

                        <div class="bg-blue-50 rounded-3xl p-6 border-l-8 border-blue-500 shadow-sm">
                            <h4 class="font-bold text-blue-900 mb-2 flex items-center gap-2">
                                <i class="fas fa-info-circle"></i> 4. คำแนะนำเพิ่มเติมจาก AI
                            </h4>
                            <ul id="resOthers" class="text-blue-800 text-sm space-y-2 list-disc ml-4">
                                </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ข้อมูลจำลองสำหรับตัวอย่าง (ในระบบจริงส่วนนี้จะถูกแทนที่ด้วยผลจาก AI)
        const expertData = {
            "กะเพรา/โหระพา": {
                cause: "พบสปอร์ของเชื้อรา Cercospora กระจายตัวบริเวณหลังใบ เกิดจากความชื้นสะสมสูงในช่วงเช้าและการระบายอากาศที่โคนต้นไม่ดี",
                fix: "ตัดแต่งกิ่งที่ใบเสียออกไปเผาทำลายทันที พ่นสารสกัดน้ำส้มควันไม้ผสมน้ำสะอาดอัตรา 1:200 ทุก 3 วัน",
                others: ["งดการให้น้ำช่วงเย็นเด็ดขาด", "เพิ่มระยะห่างระหว่างกระถาง", "บำรุงด้วยปุ๋ยแคลเซียมเพื่อสร้างความแข็งแรงให้ผนังเซลล์ใบ"]
            },
            "ใบมะกรูด": {
                cause: "เกิดจากเชื้อแบคทีเรีย Xanthomonas citri เข้าทำลายเนื้อเยื่อผ่านทางบาดแผลที่ 'หนอนชอนใบ' กัดกินไว้",
                fix: "ตัดกิ่งที่เป็นแผลตกสะเก็ดนูนออก พ่นด้วยสารประกอบคอปเปอร์ (คอปเปอร์ออกซีคลอไรด์) เพื่อยับยั้งการลามของแบคทีเรีย",
                others: ["ต้องกำจัดหนอนชอนใบที่เป็นพาหะหลัก", "ช่วงฝนตกหนักเชื้อจะแพร่กระจายทางละอองน้ำได้ง่าย", "ห้ามนำกิ่งที่ตัดแล้วทิ้งไว้ใต้โคนต้น"]
            },
            "ขิง/ข่า/ตะไคร้": {
                cause: "เชื้อราและแบคทีเรียในดินเข้าทำลายเหง้าเนื่องจากมีน้ำขังระบายอากาศยาก ทำให้เนื้อเยื่อภายในเริ่มเน่าและส่งกลิ่นเหม็น",
                fix: "ขุดกอที่เริ่มเหลืองออก โรยปูนขาวปรับสภาพดินลดความเป็นกรด พ่นสารป้องกันเชื้อรากลุ่มเมทาแลกซิลที่ดิน",
                others: ["ควรยกร่องปลูกให้สูงกว่าพื้นปกติ 20-30 ซม.", "หลีกเลี่ยงการใช้ปุ๋ยไนโตรเจน (ยูเรีย) สูงเกินไปในช่วงฝนชุก", "ตรวจเช็คระบบระบายน้ำในสวน"]
            },
            "ทั่วไป": {
                cause: "วิเคราะห์เบื้องต้นพบการขาดธาตุอาหารรองร่วมกับการเข้าทำลายของแมลงศัตรูพืชประเภทปากดูด",
                fix: "ปรับปรุงดินด้วยปุ๋ยหมักและพ่นสารสกัดจากใบยาสูบเพื่อขับไล่แมลง",
                others: ["หมั่นตรวจเช็คใต้ใบทุกสัปดาห์", "รักษาความสะอาดรอบแปลงปลูก"]
            }
        };

        function enableUpload() {
            if(document.getElementById('plantType').value) document.getElementById('step2').classList.remove('step-inactive');
        }

        function handlePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                    document.getElementById('step3').classList.remove('step-inactive');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function startAnalysis() {
            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
            
            // จำลองเวลาประมวลผล AI 2 วินาที
            setTimeout(() => {
                const plant = document.getElementById('plantType').value;
                const data = expertData[plant] || expertData["ทั่วไป"];
                const severity = Math.floor(Math.random() * 40) + 40; // สุ่ม 40-80%

                document.getElementById('loadingUI').classList.add('hidden');
                document.getElementById('analysisContent').classList.remove('hidden');
                
                document.getElementById('resPlantName').innerText = plant;
                document.getElementById('resDate').innerText = "REPORT ID: " + Date.now().toString().slice(-6);
                document.getElementById('resLevelText').innerText = severity + "%";
                document.getElementById('resCause').innerText = data.cause;
                document.getElementById('resFix').innerText = data.fix;
                
                // ใส่ข้อมูล "อื่นๆ"
                const otherList = document.getElementById('resOthers');
                otherList.innerHTML = "";
                data.others.forEach(item => {
                    const li = document.createElement('li');
                    li.innerText = item;
                    otherList.appendChild(li);
                });

                setTimeout(() => {
                    document.getElementById('resLevelBar').style.width = severity + "%";
                }, 100);
            }, 2000);
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const opt = {
                margin: 0,
                filename: 'AI_Diagnosis_Report.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function resetApp() {
            location.reload();
        }
    </script>
</body>
</html>
